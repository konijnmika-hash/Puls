<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Elke stap telt</title>
<link rel="stylesheet" href="../../lib/base.css">
<style>
#gcard{position:absolute;left:60px;right:60px;top:560px;height:860px;border-radius:52px;background:rgba(20,36,29,.92);border:1px solid #2f4a3c;padding:40px}
.ms{position:absolute;padding:14px 22px;border-radius:999px;background:#c9f27a;color:#06100c;font-weight:800;font-size:28px;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.stat{position:absolute;left:90px;right:90px;height:170px;border-radius:40px;background:#14241d;border:1px solid #2f4a3c;display:flex;align-items:center;gap:34px;padding:0 40px}
.stat .em{font-size:64px}
.stat .v{font-family:Brico;font-weight:800;font-size:70px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:28px;color:#a5bbaf;margin-top:6px}
</style></head>
<body><div id="stage">
  <div class="glow" id="g1" style="width:1500px;height:1500px;background:radial-gradient(circle,rgba(72,196,134,.28),rgba(0,0,0,0) 62%)"></div>
  <div class="glow" id="g2" style="width:1300px;height:1300px;background:radial-gradient(circle,rgba(240,160,58,.14),rgba(0,0,0,0) 62%)"></div>

  <div class="scene" data-in="0" data-out="2.55" data-fo=".35">
    <div class="abs center xh rv" data-a="0.15" style="top:740px;font-size:230px">Dag 1.</div>
    <div class="abs center rv" data-a="1.0" style="top:1010px;font-size:46px;color:var(--ink2)">Iedereen begint ergens.</div>
  </div>

  <div class="scene" data-in="2.5" data-out="10.05" data-fo=".35">
    <div class="abs center label" style="top:230px">Voortgang</div>
    <div class="abs center xh" style="top:290px;font-size:150px"><span class="tab-num">Dag <span id="day">1</span></span></div>
    <div id="gcard">
      <div class="row"><div><div class="small" style="font-size:26px">Gewicht</div><div class="h tab-num" style="font-size:84px"><span id="w">84,0</span> <span style="font-size:40px;color:#a5bbaf">kg</span></div></div>
        <div style="text-align:right"><div class="small" style="font-size:26px">Streefgewicht</div><div class="h" style="font-size:52px;color:var(--lime)">76 kg</div></div></div>
      <svg id="graph" width="840" height="560" viewBox="0 0 840 560" style="margin-top:30px;overflow:visible"></svg>
      <div class="mono" style="position:absolute;right:40px;bottom:22px;font-size:18px;letter-spacing:.15em;color:#4f6a5b">VOORBEELDWEERGAVE</div>
    </div>
    <div id="mss"></div>
  </div>

  <div class="scene" data-in="10" data-out="15.05" data-fo=".35">
    <div class="abs center label" style="top:230px">12 weken</div>
    <div class="abs center h" style="top:290px;font-size:96px">Kijk wat je<br>allemaal deed.</div>
    <div id="stats"></div>
  </div>

  <div class="scene" data-in="15" data-out="20.05" data-fo=".4">
    <svg class="abs" id="ghost" style="left:0;top:520px;opacity:.18" width="1080" height="900" viewBox="0 0 840 560"></svg>
    <div class="abs center xh rv" data-a="15.05" data-s=".2" style="top:640px;font-size:128px">Kleine stappen.</div>
    <div class="abs center xh rv" data-a="17.5" data-s=".2" style="top:810px;font-size:150px;color:var(--lime)">Grote<br>verandering.</div>
  </div>

  <div class="scene" data-in="20" data-out="99">
    <div class="abs" id="ctaLogo" style="left:440px;top:360px;width:200px;height:200px"></div>
    <div class="abs center h rv" data-a="20.1" style="top:620px;font-size:96px">Begin vandaag.</div>
    <div class="abs center xh rv" data-a="21.25" data-s=".16" data-fx="slam" style="top:770px;font-size:200px">14 dagen</div>
    <div class="abs center xh" id="gratis" style="top:970px;font-size:200px;color:var(--lime)">gratis.</div>
    <div class="cta-btn" id="cta" style="left:190px;width:700px;top:1300px">Download Puls nu →</div>
  </div>
</div>
<script src="../../lib/engine.js"></script>
<script>
window.VIDEO = { w: 1080, h: 1920, dur: 27, fps: 30, bpm: 96, title: 'Elke stap telt' };
$('#ctaLogo').innerHTML = logoSVG(200);
const SP = 60 / 96;
// voorbeeldgegevens: 85 dagen, rustig dalend met natuurlijke schommelingen
const r = seeded(21), DAYS = 85, W = [];
let nz = 0;
for (let d = 0; d < DAYS; d++) { nz = nz * .7 + (r() - .5) * .5; W.push(84 - 6.8 * Math.pow(d / 84, .85) + nz * .6 + .25 * Math.sin(d * .9)); }
W[0] = 84; W[DAYS - 1] = 77.2;
const X = d => 60 + d / 84 * 760, Y = w => 30 + (85 - w) / (85 - 75) * 480;
function axes() {
  let g = '';
  [84, 80, 76].forEach(w => g += `<line x1="60" x2="820" y1="${Y(w)}" y2="${Y(w)}" stroke="#253b31" stroke-width="1.5"/><text x="40" y="${Y(w) + 8}" text-anchor="end" font-family="DejaVu Sans Mono" font-size="22" fill="#6c8478">${w}</text>`);
  for (let wk = 0; wk <= 12; wk += 3) g += `<text x="${X(wk * 7)}" y="550" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="22" fill="#6c8478">wk ${wk}</text>`;
  g += `<line x1="60" x2="820" y1="${Y(76)}" y2="${Y(76)}" stroke="#c9f27a" stroke-width="3" stroke-dasharray="10 10" opacity=".8"/>`;
  return g;
}
const pathTo = n => W.slice(0, Math.max(1, Math.floor(n)) + 1).map((w, d) => `${d ? 'L' : 'M'}${X(d).toFixed(1)} ${Y(w).toFixed(1)}`).join(' ');
$('#graph').innerHTML = `<defs><linearGradient id="lgw" x1="0" x2="1"><stop offset="0" stop-color="#48c486"/><stop offset="1" stop-color="#c9f27a"/></linearGradient>
  <linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#48c486" stop-opacity=".35"/><stop offset="1" stop-color="#48c486" stop-opacity="0"/></linearGradient></defs>
  ${axes()}<path id="ar" fill="url(#area)"/><path id="ln" fill="none" stroke="url(#lgw)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="hd" r="13" fill="#eaffc2"/><circle id="hd2" r="30" fill="#c9f27a" opacity=".25"/>`;
$('#ghost').innerHTML = `<path d="${pathTo(84)}" fill="none" stroke="#c9f27a" stroke-width="8" stroke-linecap="round"/>`;
const MS = [[21, '−2 kg', 7], [35, '🔥 35 dagen op rij', 10], [63, '−5 kg', 13]];
$('#mss').innerHTML = MS.map(([d, t], i) => `<div class="ms" id="ms${i}">${t}</div>`).join('');
const STATS = [['🏋️', '48', 'trainingen gedaan'], ['🔥', '84 dagen', 'op rij ingevuld'], ['🥩', '6 van 7', 'dagen eiwitdoel gehaald'], ['👟', '9.400', 'stappen per dag gemiddeld']];
$('#stats').innerHTML = STATS.map(([e, v, l], i) => `<div class="stat" id="st${i}" style="top:${600 + i * 200}px"><div class="em">${e}</div><div><div class="v">${v}</div><div class="l">${l}</div></div></div>`).join('');

function render(t) {
  $('#g1').style.transform = `translate(${-200 + Math.sin(t * .25) * 120}px, ${200 + Math.cos(t * .2) * 140}px)`;
  $('#g2').style.transform = `translate(${350 + Math.cos(t * .22) * 140}px, ${900 + Math.sin(t * .3) * 160}px)`;
  $('#g1').style.opacity = .7 + P(t, 15, 16) * .4 * (1 - P(t, 19.5, 20.5)) + (t > 20 ? .3 : 0);
  scenes(t); reveal(t);
  // grafiek tekenen: van tel 4 tot tel 15
  if (t > 2.4 && t < 10.2) {
    const k = eio(P(t, b(4), b(15))), d = k * 84;
    $('#ln').setAttribute('d', pathTo(d));
    $('#ar').setAttribute('d', pathTo(d) + ` L${X(Math.floor(d))} 510 L60 510 Z`);
    const di = Math.min(84, Math.floor(d)), wv = W[di];
    $('#hd').setAttribute('cx', X(di)); $('#hd').setAttribute('cy', Y(wv));
    $('#hd2').setAttribute('cx', X(di)); $('#hd2').setAttribute('cy', Y(wv));
    $('#hd2').setAttribute('r', 24 + beatPulse(t, 0, 6) * 14);
    $('#day').textContent = di + 1 > 84 ? 84 : di + 1;
    $('#w').textContent = nl(wv, 1);
    show('#gcard', eo5(P(t, 2.5, 3.1)), { y: 120, blur: 0 });
    MS.forEach(([dd, txt, bt], i) => {
      const e = $('#ms' + i), a = b(bt), q = back(P(t, a, a + .45));
      const gx = 60 + 40 + X(dd), gy = 560 + 40 + 200 + Y(W[dd]);
      e.style.left = Math.min(gx - 40, 1080 - 380) + 'px'; e.style.top = (gy - 110) + 'px';
      e.style.opacity = P(t, a, a + .1); e.style.transform = `scale(${lerp(.4, 1, q)})`;
    });
  }
  // statistieken op de tel
  STATS.forEach((x, i) => { const a = b(17 + i * 1.5), q = back(P(t, a, a + .5)); const e = $('#st' + i); e.style.opacity = P(t, a, a + .12); e.style.transform = `translateX(${(1 - q) * 140}px)`; });
  // CTA
  if (t > 19.9) {
    const pulse = beatPulse(t, 21, 10), L = $('#ctaLogo'), k = back(P(t, 20.05, 20.6));
    L.style.opacity = P(t, 20.05, 20.15); L.style.transform = `scale(${lerp(.3, 1, k) + pulse * .05})`;
    L.style.filter = `drop-shadow(0 0 ${40 + pulse * 50}px rgba(201,242,122,${.3 + pulse * .3}))`;
    logoDraw(L, eio(P(t, 20.1, 20.8)));
    const g = eo5(P(t, b(35), b(35) + .4)), gr = $('#gratis');
    gr.style.opacity = g; gr.style.transform = `scale(${lerp(1.6, 1, g) + pulse * .02})`; gr.style.filter = g < 1 ? `blur(${(1 - g) * 20}px)` : '';
    gr.style.textShadow = `0 0 ${60 + pulse * 40}px rgba(201,242,122,${.35 + pulse * .25})`;
    const c = $('#cta'), bk = back(P(t, b(36), b(36) + .55)), pl = t > b(36) + .55 ? Math.sin((t - b(36)) * Math.PI / SP / 2) * .5 + .5 : 0;
    c.style.opacity = P(t, b(36), b(36) + .12); c.style.transform = `scale(${lerp(.6, 1, bk) + pl * .025})`;
    c.style.boxShadow = `0 0 ${40 + pl * 70}px rgba(201,242,122,${.25 + pl * .3})`;
  }
}
boot(render);
</script></body></html>
